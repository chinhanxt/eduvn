<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
  <div id="meta" class="ek-meta ek-col-1 ek-span-10" style="top:64px">HOÁ HỌC 10 · BẢNG TUẦN HOÀN CÁC NGUYÊN TỐ</div>
  <h1 id="title" class="ek-title ek-col-1 ek-span-12" style="top:112px" data-ek-words>Xu hướng biến đổi <span class="kw">độ âm điện (Pauling)</span></h1>

  <div class="ek-stage">

      <path id="arrRow" d="M 16,52 L 1226,52" class="trend-line ek-stroke-lam"/>
      <polygon id="arrRowH" points="1254,52 1218,36 1218,68" class="ek-fill-lam ek-hidden"/>
      <text id="lblRow" x="630" y="34" text-anchor="middle" class="t-lbl ek-fill-lam ek-hidden" data-ek-beat="1">Chu kỳ 2: Điện tích hạt nhân tăng → Độ âm điện tăng</text>

      <!-- 7 ô Chu kỳ 2: x = 16 + k*180, y = 84, w = 164, h = 132 -->
      <g id="gLi" class="pt-cell ek-hidden" data-ek-beat="0">
        <rect id="rLi" x="16" y="84" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="98" y="144" text-anchor="middle" class="c-sym">Li</text>

      </g>
      <g id="gBe" class="pt-cell ek-hidden">

      </g>
      <g id="gB" class="pt-cell ek-hidden">
        <rect id="rB" x="376" y="84" width="164" height="132" rx="14" class="cell-rect"/>

        <text x="458" y="194" text-anchor="middle" class="c-val">2,04</text>
      </g>
      <g id="gC" class="pt-cell ek-hidden">
        <rect id="rC" x="556" y="84" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="638" y="144" text-anchor="middle" class="c-sym">C</text>
        <text x="638" y="194" text-anchor="middle" class="c-val">2,55</text>
      </g>
      <g id="gN" class="pt-cell ek-hidden">
        <rect id="rN" x="736" y="84" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="818" y="144" text-anchor="middle" class="c-sym">N</text>
        <text x="818" y="194" text-anchor="middle" class="c-val">3,04</text>
      </g>
      <g id="gO" class="pt-cell ek-hidden">
        <rect id="rO" x="916" y="84" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="998" y="144" text-anchor="middle" class="c-sym">O</text>
        <text x="998" y="194" text-anchor="middle" class="c-val">3,44</text>
      </g>
      <g id="gF" class="pt-cell ek-hidden">
        <rect id="rF" x="1096" y="84" width="164" height="132" rx="14" class="cell-rect"/>

        <text id="valF" x="1178" y="194" text-anchor="middle" class="c-val">3,98</text>
      </g>

      <!-- 3 ô còn lại của Nhóm VIIA: x = 1096, y = 232, 380, 528 -->
      <g id="gCl" class="pt-cell ek-hidden">
        <rect id="rCl" x="1096" y="232" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="1178" y="292" text-anchor="middle" class="c-sym">Cl</text>
        <text x="1178" y="342" text-anchor="middle" class="c-val">3,16</text>
      </g>
      <g id="gBr" class="pt-cell ek-hidden">
        <rect id="rBr" x="1096" y="380" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="1178" y="440" text-anchor="middle" class="c-sym">Br</text>
        <text x="1178" y="490" text-anchor="middle" class="c-val">2,96</text>
      </g>

        <rect id="rI" x="1096" y="528" width="164" height="132" rx="14" class="cell-rect"/>
        <text x="1178" y="588" text-anchor="middle" class="c-sym">I</text>
        <text x="1178" y="638" text-anchor="middle" class="c-val">2,66</text>

      <!-- Mũi tên dọc Nhóm VIIA (bên phải cột VIIA) -->
      <path id="arrCol" d="M 1304,96 L 1304,626" class="trend-line ek-stroke-doSon"/>
      <polygon id="arrColH" points="1304,654 1288,618 1320,618" class="ek-fill-doSon ek-hidden"/>

      <rect id="ringF" x="1086" y="74" width="184" height="152" rx="18" class="f-ring ek-hidden"/>

    <!-- Thẻ tổng hợp ở vùng trống dưới trái (y = 486..866, x = col 1..8) -->
    <div id="infoCard" class="ek-card info-box ek-col-1 ek-span-7 ek-hidden" style="top:500px" data-ek-beat="3">
      <h3>Cực đại tại Fluorine (F = 3,98)</h3>
      <p>Nguyên tử bán kính nhỏ, lực hút electron liên kết mạnh nhất. Độ âm điện tăng sang phải (chu kỳ) và giảm xuống dưới (nhóm A).</p>
    </div>

</div>
<style>
  .cell-rect{fill:var(--surface);stroke:var(--line);stroke-width:3px}
  .c-sym{font-family:var(--read);font-size:48px;font-weight:700;fill:var(--ink)}
  .c-val{font-family:var(--ui);font-size:36px;font-weight:600;fill:var(--ink2);font-variant-numeric:tabular-nums}
  .trend-line{fill:none;stroke-width:7px;stroke-linecap:round}
  .t-lbl{font-family:var(--ui);font-size:38px;font-weight:700}
  .t-sub{font-family:var(--ui);font-size:36px;font-weight:600}
  .f-ring{fill:none;stroke:var(--c-doSon);stroke-width:7px}
  .info-box{border-left-color:var(--c-doSon);padding:28px 34px}
  .info-box h3{font-size:44px;color:var(--c-doSon);margin-bottom:12px}
  .info-box p{font-size:38px;line-height:1.45}
</style>
<script>
const tl = gsap.timeline({ paused: true });

// Beat 0: Hiện tiêu đề + 10 ô nguyên tố nền giấy
EK.enter(tl, "#meta", 0.05, { from: "fade", dur: 0.45 });
EK.words(tl, "#title", { t: 0.15, per: 0.08 });
EK.enter(tl, "#gLi, #gBe, #gB, #gC, #gN, #gO, #gF, #gCl, #gBr, #gI", EK.cue(0), { from: "up", dur: 0.55, stagger: 0.14 });

// Beat 1: Tô sắc độ tăng dần dọc Chu kỳ 2 + mũi tên tăng
const t1 = EK.cue(1);
EK.draw(tl, "#arrRow", t1, 1.3);
EK.enter(tl, "#arrRowH, #lblRow", t1 + 0.15, { from: "fade", dur: 0.5 });
EK.fill(tl, "#rLi", t1 + 0.35, "sunken", { dur: 0.35 });
EK.fill(tl, "#rBe", t1 + 0.6, "accentSoft", { dur: 0.35 });
EK.fill(tl, "#rB", t1 + 0.85, "lucLam", { alpha: 0.14, dur: 0.35 });
EK.fill(tl, "#rC", t1 + 1.1, "lam", { alpha: 0.16, dur: 0.35 });
EK.fill(tl, "#rN", t1 + 1.35, "tim", { alpha: 0.16, dur: 0.35 });
EK.fill(tl, "#rO", t1 + 1.6, "hong", { alpha: 0.16, dur: 0.35 });
EK.fill(tl, "#rF", t1 + 1.85, "doSon", { alpha: 0.18, dur: 0.45 });
EK.tint(tl, "#rF", t1 + 1.85, "doSon", { prop: "stroke", dur: 0.45 });

// Beat 2: Tô sắc độ giảm dần dọc Nhóm VIIA + mũi tên giảm
const t2 = EK.cue(2);
EK.draw(tl, "#arrCol", t2, 1.2);
EK.enter(tl, "#arrColH, #lblCol1, #lblCol2, #lblCol3", t2 + 0.2, { from: "fade", dur: 0.5, stagger: 0.15 });
EK.fill(tl, "#rCl", t2 + 0.65, "tim", { alpha: 0.16, dur: 0.4 });
EK.fill(tl, "#rBr", t2 + 1.1, "lam", { alpha: 0.14, dur: 0.4 });
EK.fill(tl, "#rI", t2 + 1.55, "accentSoft", { dur: 0.4 });

// Beat 3: Khoanh cực đại Fluorine + thẻ quy luật tổng quát
const t3 = EK.cue(3);
EK.enter(tl, "#infoCard", t3, { from: "up", dur: 0.65 });
EK.draw(tl, "#ringF", t3 + 0.4, 0.9);
EK.tint(tl, "#symF, #valF", t3 + 0.4, "doSon", { prop: "fill", dur: 0.45 });
EK.mark(tl, "#infoCard h3", t3 + 1.3, "underline", { color: "doSon", dur: 0.6 });

window.__timelines["main"] = tl;
</script>
