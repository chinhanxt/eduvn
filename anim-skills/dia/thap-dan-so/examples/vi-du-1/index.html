<script>
const tl = gsap.timeline({ paused: true });
EK.enter(tl, "#tt, #yr-card, #pyr-box", EK.cue(0), { from: "up", stagger: 0.12 });
tl.fromTo("#pyr .ek-bar-0", { scaleX: 0 }, { scaleX: 1, transformOrigin: "right center", duration: 1.0, stagger: 0.05, ease: "expo.out" }, EK.cue(0) + 0.3);
tl.fromTo("#pyr .ek-bar-1", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left center", duration: 1.0, stagger: 0.05, ease: "expo.out" }, EK.cue(0) + 0.3);
EK.count(tl, "#n-yr", 1999, 2019, EK.cue(1), 1.4, { decimals: 0 });
EK.enter(tl, "#c-morph", EK.cue(1), { from: "right" });
const bars = document.querySelectorAll("#pyr .ek-bar[data-scale-after]");
bars.forEach(function (el, idx) {
  const s = parseFloat(el.getAttribute("data-scale-after")) || 1;
  const orig = el.classList.contains("ek-bar-0") ? "right center" : "left center";
  tl.to(el, { scaleX: s, transformOrigin: orig, duration: 1.5, ease: "power3.inOut" }, EK.cue(1) + 0.1 + (idx % 8) * 0.04);
});
EK.enter(tl, "#c-stat", EK.cue(2), { from: "right" });
EK.enter(tl, "#c-end", EK.cue(3), { from: "up" });
window.__timelines["main"] = tl;
</script>
