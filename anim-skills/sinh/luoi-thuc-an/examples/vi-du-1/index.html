<style>
  .lt-panel { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

  .lt-bar-2 { width: 66%; background: var(--c-lam); }
  .lt-bar-3 { width: 40%; background: var(--c-tim); }
  .lt-bar-4 { width: 20%; background: var(--c-doSon); }

<script>
  const tl = gsap.timeline({ paused: true });

  // Beat 0 (0 - 4.5s): Bậc 1 (Cỏ) và tầng đáy 10.000 kcal
  EK.grow(tl, "#bar-1", 0.3, 1.1, { from: "left" });
  EK.count(tl, "#val-1", 0, 10000, 0.4, 1.3, { decimals: 0, suffix: " kcal" });
  EK.mark(tl, "#tt .kw", 2.0, "highlight", { color: "xanhLa" });

  // Beat 1 (4.5 - 9.0s): Mũi tên lên Châu chấu, Thỏ + tầng 2 (1.000 kcal)
  EK.arrow(tl, "#ar-1, #ar-2", 4.5, 0.9);
  EK.enter(tl, "#n-b2", EK.cue(1), { from: "up", dur: 0.55 });
  tl.set("#bar-2", { opacity: 1 }, 5.1);
  EK.grow(tl, "#bar-2", 5.1, 1.0, { from: "left" });
  EK.count(tl, "#val-2", 0, 1000, 5.2, 1.1, { decimals: 0, suffix: " kcal" });

  // Beat 2 (9.0 - 13.6s): Lên Ếch, Rắn (100 kcal) rồi Đại bàng (10 kcal)
  EK.arrow(tl, "#ar-3, #ar-4, #ar-5", 9.0, 0.8);
  EK.enter(tl, "#n-b3", EK.cue(2), { from: "up", dur: 0.5 });
  tl.set("#bar-3", { opacity: 1 }, 9.6);
  EK.grow(tl, "#bar-3", 9.6, 0.9, { from: "left" });
  EK.count(tl, "#val-3", 0, 100, 9.7, 1.0, { decimals: 0, suffix: " kcal" });

  EK.arrow(tl, "#ar-6, #ar-7", 11.1, 0.8);
  EK.enter(tl, "#n-b4", 11.5, { from: "up", dur: 0.5 });
  tl.set("#bar-4", { opacity: 1 }, 11.8);
  EK.grow(tl, "#bar-4", 11.8, 0.9, { from: "left" });
  EK.count(tl, "#val-4", 0, 10, 11.9, 0.9, { decimals: 0, suffix: " kcal" });

  // Beat 3 (13.6 - 18.0s): Nhấn quy tắc truyền 10% năng lượng
  EK.enter(tl, "#rule-card", EK.cue(3), { from: "up", dur: 0.55 });
  EK.mark(tl, "#rule-card h3", 14.5, "highlight", { color: "doSon" });

  window.__timelines["main"] = tl;
</script>
