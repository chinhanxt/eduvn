function render(){frame=0;world.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;view.style.backgroundSize=`${Math.max(8,20*scale)}px ${Math.max(8,20*scale)}px`;view.style.backgroundPosition=`${tx}px ${ty}px`;document.querySelector('#zoom').textContent=Math.round(scale*100)+'%';if(mode==='detail'){flowIndex=Math.max(0,Math.min(flows.length-1,Math.floor((-ty/scale+80)/440)));document.querySelector('#flow-count').textContent=String(flowIndex+1).padStart(2,'0')+'/'+flows.length;mini.querySelectorAll('[data-flow]').forEach((g,i)=>{g.firstElementChild.setAttribute('fill',i===flowIndex?'#2563eb':'#e4edf9');g.children[1].setAttribute('fill',i===flowIndex?'white':'#52729e')});}else{const r=mini.querySelector('.map-view');if(r){r.setAttribute('x',-tx/scale);r.setAttribute('y',-ty/scale);r.setAttribute('width',view.clientWidth/scale);r.setAttribute('height',view.clientHeight/scale);}}}

function zoomAt(factor,x=view.clientWidth/2,y=view.clientHeight/2){stopAnimation();const next=Math.min(1.8,Math.max(.08,scale*factor));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;update()}

function closeDetail(focus=false){detail.classList.remove('open');detail.inert=true;selected=null;nodeEls.forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-expanded','false')});edgeEls.forEach(e=>e.path.classList.remove('related'));if(focus&&returnFocus?.isConnected)returnFocus.focus({preventScroll:true})}

view.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==1)return;stopAnimation();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(e.pointerType==='mouse')e.preventDefault();suppressClick=false;if(pointers.size===2){const[a,b]=[...pointers.values()];pinch={d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),z:scale,wx:((a.x+b.x)/2-tx)/scale,wy:((a.y+b.y)/2-ty)/scale};drag=null;suppressClick=true;return;}const b=e.button===0?e.target.closest('.node'):null,n=b?byId.get(b.dataset.id):null;drag={pointer:e.pointerId,x:e.clientX,y:e.clientY,tx,ty,node:n,nx:n?.x,ny:n?.y,started:false};});

function endPointer(e){pointers.delete(e.pointerId);if(pinch){pinch=null;drag=null;suppressClick=true;}if(drag?.pointer===e.pointerId){if(!drag.started&&!drag.node&&e.type==='pointerup')closeDetail();drag=null;}if(view.hasPointerCapture(e.pointerId))view.releasePointerCapture(e.pointerId);view.classList.remove('dragging')}
